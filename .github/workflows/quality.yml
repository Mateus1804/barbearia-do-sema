name: Qualidade
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REQUIRE_BROWSER_TESTS: '1'
      DB_PATH: ':memory:'
      SMTP_HOST: ''
      SMTP_USER: ''
      SMTP_PASS: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
